<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Supply Chain Tracker</h1>

 
  <div class="flex-row">
   
    <div class="section">
      <h2>Add Product</h2>
      <form id="addProductForm">
        <input type="text" id="productName" placeholder="Product Name" required /><br />
        <input type="text" id="productDescription" placeholder="Product Description" required /><br />
        <button type="submit">Add Product</button>
      </form>
    </div>

 
    <div class="section">
      <h2>Update Product Status</h2>
      <form id="updateStatusForm">
        <input type="number" id="productId" placeholder="Product ID" required /><br />
        <input type="text" id="productStatus" placeholder="Product Status" required /><br />
        <button type="submit">Update Status</button>
      </form>
    </div>
  </div>

 
  <div class="flex-row">
    
    <div class="section">
      <h2>Get Product Info</h2>
      <form id="getProductForm">
        <input type="number" id="getProductId" placeholder="Product ID" required /><br />
        <button type="submit">Get Product Info</button>
      </form>
    </div>

    
    <div id="productInfo" class="product-info">
      
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
